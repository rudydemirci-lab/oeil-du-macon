<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'œil du maçon</title>
<meta name="description" content="10 épreuves, 13 secondes chacune. Défie tes collègues de chantier : qui a vraiment l'œil ?">
<style>
:root{ --fond:#eaf0fa; --blanc:#fff; --encre:#14213d; --bleu:#1d4ed8; --rouge:#d62828; --gris:#c9d1dc; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fond);color:var(--encre);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:460px;margin:0 auto;padding:14px 14px 40px;min-height:100vh}
h1{font:400 3.4rem/0.9 Haettenschweiler,Impact,"Arial Narrow Bold","Roboto Condensed",sans-serif;margin:10px 0 14px;text-transform:uppercase;color:var(--bleu)}
h1 span{display:block;width:fit-content}
h1 span + span{color:var(--rouge);border-top:4px solid var(--rouge);margin-top:6px;padding-top:6px}
h2{font-size:1.1rem;line-height:1.25;margin:10px 0 8px}
p{margin:0 0 14px}
.petit{font-size:.9rem;opacity:.85}
.bleu{color:var(--bleu);font-weight:700}.rouge{color:var(--rouge);font-weight:700}
label{display:block;font-weight:600;margin:18px 0 6px}
input{font:inherit;width:100%;padding:13px 12px;border:2px solid var(--encre);border-radius:6px;background:var(--blanc);color:var(--encre)}
button,.btn{font:inherit;font-weight:800;display:block;width:100%;text-align:center;text-decoration:none;padding:14px 12px;margin-top:12px;border:2px solid var(--encre);border-radius:6px;background:var(--bleu);color:#fff;cursor:pointer;touch-action:manipulation}
button.second,.btn.second{background:var(--blanc);color:var(--bleu)}
button.go{background:var(--rouge);font-size:1.5rem;padding:16px 12px}
button:active,.btn:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
.erreur{color:var(--rouge);font-weight:600;min-height:1.4em;margin:8px 0 0}
.code{font:400 2.2rem/1 Haettenschweiler,Impact,"Arial Narrow Bold",sans-serif;letter-spacing:.08em;color:var(--bleu)}
.tete{display:flex;justify-content:space-between;font-weight:700}
.ruban{height:20px;background:var(--blanc);border:2px solid var(--encre);border-radius:4px;margin-top:6px;overflow:hidden}
#bande{height:100%;width:100%;background:repeating-linear-gradient(90deg,#fff 0 1.5px,transparent 1.5px 12px) 0 100%/100% 45% no-repeat,var(--rouge);transition:width .1s linear}
svg.fig{display:block;width:100%;height:auto;background:var(--blanc);border:2px solid var(--encre);border-radius:6px}
.cible{stroke:var(--rouge);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rep{stroke:var(--bleu);stroke-width:2.5;fill:none;stroke-linecap:round}
.tiret{stroke:var(--bleu);stroke-width:2;stroke-dasharray:6 5;fill:none}
.plein{fill:var(--gris);stroke:#7d8797;stroke-width:1}
.rplein{fill:#f3bcbc;stroke:var(--rouge);stroke-width:2.5;stroke-linejoin:round}
svg text{font:700 14px system-ui,sans-serif;fill:var(--bleu)}
svg text.cote{fill:var(--encre)}
.aff{display:flex;justify-content:center;align-items:baseline;gap:6px;height:48px;line-height:44px;border:2px solid var(--encre);border-radius:6px;background:var(--blanc);font-size:1.6rem;font-weight:800;margin-top:8px}
.aff .vide{opacity:.3}
.pave{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pave button{margin:0;padding:0;height:46px;font-size:1.3rem;background:var(--blanc);color:var(--encre)}
.pave button.ok{grid-column:1/-1;height:54px;background:var(--rouge);color:#fff}
.retour{background:var(--blanc);border:2px solid var(--encre);border-radius:6px;padding:12px;margin-top:10px}
.retour .pts{font:400 2rem/1 Haettenschweiler,Impact,"Arial Narrow Bold",sans-serif;color:var(--bleu)}
.score{font:400 5rem/0.9 Haettenschweiler,Impact,"Arial Narrow Bold",sans-serif;margin:6px 0 4px;color:var(--rouge)}
.score small{font-size:1.6rem;color:var(--encre)}
ol.rang{list-style:none;margin:8px 0 18px;padding:0;border:2px solid var(--encre);border-radius:6px;background:var(--blanc);overflow:hidden}
ol.rang li{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--gris)}
ol.rang li:first-child{border-top:0}
ol.rang .pos{width:1.6em;font-weight:700;color:var(--rouge)}
ol.rang .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.rang .sc{font-weight:700;font-variant-numeric:tabular-nums}
ol.rang li.moi{background:#d6e2ff;font-weight:700}
.podium{display:flex;align-items:flex-end;gap:6px;margin:10px 0 16px}
.podium div{flex:1;min-width:0;text-align:center;border:2px solid var(--encre);border-radius:6px 6px 0 0;background:var(--blanc);padding:8px 4px;font-weight:700}
.podium .p1{height:128px;background:var(--rouge);color:#fff}
.podium .p2{height:100px;background:#d6e2ff}
.podium .p3{height:78px}
.podium b{display:block;font:400 2.2rem/1 Haettenschweiler,Impact,"Arial Narrow Bold",sans-serif}
.podium span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
.victoire{font:400 2rem/1.05 Haettenschweiler,Impact,"Arial Narrow Bold",sans-serif;color:var(--bleu);text-transform:uppercase;margin:10px 0}
#feu{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){#bande{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ---------- utilitaires ---------- */
const TEMPS = 13, NBQ = 10;
const app = document.getElementById('app');
const el = id => document.getElementById(id);
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); if(v !== null) return JSON.parse(v); }catch(e){} return k in mem ? mem[k] : null; },
  set(k,v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fr = n => String(n).replace('.', ',');
const f1 = n => n.toFixed(1);
const has = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
function h32(s){ let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let a = h32(seed); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }
const ri = (r,a,b) => a + Math.floor(r() * (b - a + 1));
const cleanName = s => String(s||'').replace(/[<>|~]/g,'').trim().slice(0,16);
const NOMS_DEFI = { TRUELLE:'Truelle', TALOCHE:'Taloche', MASSETTE:'Massette', BURIN:'Burin', NIVEAU:'Niveau', CORDEAU:'Cordeau', AUGE:'Auge', PELLE:'Pelle', PIOCHE:'Pioche', BROUETTE:'Brouette',
  MARTEAU:'Marteau', TENAILLE:'Tenaille', EQUERRE:'Équerre', FILAPLOMB:'Fil à plomb', BETONNIERE:'Bétonnière', LISSEUSE:'Lisseuse', PLATOIR:'Platoir', MAILLET:'Maillet', REGLE:'Règle', DISQUEUSE:'Disqueuse',
  PERFO:'Perfo', SERREJOINT:'Serre-joint', CHEVILLETTE:'Chevillette', LANGUEDECHAT:'Langue de chat', BOUCHARDE:'Boucharde', TAMIS:'Tamis', SEAU:'Seau', MALAXEUR:'Malaxeur', PIEDDEBICHE:'Pied-de-biche', METRE:'Mètre' };
const newSeed = () => { const k = Object.keys(NOMS_DEFI), c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = k[Math.floor(Math.random()*k.length)]; for(let i=0;i<3;i++) s += c[Math.floor(Math.random()*c.length)]; return s; };
const nomDefi = seed => { for(const k in NOMS_DEFI) if(seed.length === k.length+3 && seed.startsWith(k)) return 'Défi '+NOMS_DEFI[k]; return 'Défi '+seed; };
/* repère bleu en bas à gauche de la figure */
const ref = (s,label) => `<path class="rep" d="M20 205H${20+s}M20 199V211M${20+s} 199V211"/><text x="${28+s}" y="210">${label}</text>`;

/* ---------- épreuves (même code de défi = mêmes épreuves). Figures en 340 x 220 ---------- */
function qAngle(r){
  const ang = ri(r,8,172), a0 = r()*Math.PI*2, a1 = a0 + ang*Math.PI/180, cx=170, cy=110, L=90;
  const p = (a,d) => f1(cx+Math.cos(a)*d)+' '+f1(cy+Math.sin(a)*d);
  return { title:'Quel est cet angle ?', unit:'°', answer:ang, tol:25,
    svg:`<path class="rep" d="M${p(a0,24)}A24 24 0 0 1 ${p(a1,24)}"/><path class="cible" d="M${p(a0,L)}L${cx} ${cy}L${p(a1,L)}"/>` };
}
function qPente(r){
  const p = ri(r,2,45), rise = 300*p/100;
  return { title:'Quelle est la pente de ce talus ?', unit:'%', answer:p, tol:Math.max(5,p*0.5),
    svg:`<polygon class="plein" points="20,195 320,195 320,${195-rise}"/><path class="cible" d="M20 195L320 ${195-rise}"/><path class="tiret" d="M8 195H332"/>` };
}
function qLong(r){
  const s = ri(r,50,62), cm = ri(r,8,84)*5, px = cm/100*s, rot = ri(r,-25,25);
  return { title:'Quelle est la longueur de ce bastaing ?', unit:'cm', answer:cm, tol:cm*0.4,
    svg:`<g transform="translate(170 85) rotate(${rot})"><rect class="rplein" x="${f1(-px/2)}" y="-8" width="${f1(px)}" height="16"/></g>${ref(s,'100 cm')}` };
}
function qDiam(r){
  const s = ri(r,50,62), cm = ri(r,4,54)*5, R = cm/100*s/2;
  return { title:'Quel est le diamètre de cette buse ?', unit:'cm', answer:cm, tol:cm*0.4,
    svg:`<circle class="rplein" cx="190" cy="95" r="${f1(R)}"/><circle class="plein" cx="190" cy="95" r="${f1(R*0.8)}" style="fill:#fff"/>${ref(s,'100 cm')}` };
}
function qBlocs(r){
  const cols = ri(r,6,12), rows = ri(r,4,9), top = ri(r,1,cols);
  const bw = Math.min(320/(cols+0.5), 180/(rows*0.4)), bh = bw*0.4, x0 = (340-(cols+0.5)*bw)/2, y0 = 205;
  let hole = null;
  if(r() < 0.6){ const w = ri(r,2,3), h = 2, c0 = ri(r,1,cols-1-w), r0 = ri(r,1,rows-1-h); hole = {c0,r0,w,h}; }
  let n = 0, svg = '';
  for(let row=0; row<rows; row++){
    const count = row === rows-1 ? top : cols, off = (row%2)*bw/2;
    for(let c=0; c<count; c++){
      if(hole && row>=hole.r0 && row<hole.r0+hole.h && c>=hole.c0 && c<hole.c0+hole.w) continue;
      n++; svg += `<rect class="plein" x="${f1(x0+off+c*bw)}" y="${f1(y0-(row+1)*bh)}" width="${f1(bw-1.5)}" height="${f1(bh-1.5)}"/>`;
    }
  }
  return { title:'Combien de parpaings dans ce mur ?', unit:'', answer:n, tol:n*0.4, svg };
}
function qTuyaux(r){
  const n = ri(r,5,10), k = ri(r,2,Math.min(n-1,6));
  const R = Math.min(150/n, 185/(2+(k-1)*1.732));
  let c = 0, svg = '';
  for(let i=0;i<k;i++) for(let j=0;j<n-i;j++){ c++; const x = 170-(n-i-1)*R+j*2*R, y = 205-R-i*R*1.732;
    svg += `<circle class="plein" cx="${f1(x)}" cy="${f1(y)}" r="${f1(R-1)}"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(R*0.6)}" fill="#fff" stroke="#7d8797"/>`; }
  return { title:'Combien de tuyaux sur ce tas ?', unit:'', answer:c, tol:c*0.4, svg };
}
function qMarches(r){
  const n = ri(r,9,26), w = 300/n, h = 175/n;
  let d = 'M20 200';
  for(let i=0;i<n;i++) d += `v${f1(-h)}h${f1(w)}`;
  return { title:'Combien de marches dans cet escalier ?', unit:'', answer:n, tol:n*0.3, svg:`<path class="plein" d="${d}V200Z"/>` };
}
function qZigzag(r){
  const n = ri(r,4,8), s = ri(r,30,42); let len = 0, px = 25, py = ri(r,18,70), d = `M${px} ${py}`;
  for(let i=1;i<=n;i++){ const x = 25+i*290/n, y = i%2 ? ri(r,100,165) : ri(r,18,70); len += Math.hypot(x-px,y-py); d += `L${f1(x)} ${y}`; px = x; py = y; }
  const m = Math.round(len/s*10);
  return { title:'Quelle longueur de tranchée à creuser ?', unit:'m', answer:m, tol:m*0.4, svg:`<path class="cible" d="${d}"/>${ref(s,'10 m')}` };
}
function qPerim(r){
  const k = ri(r,5,6), s = ri(r,28,40), pts = [];
  for(let i=0;i<k;i++){ const a = i*2*Math.PI/k + r()*0.6, rad = ri(r,40,82); pts.push([170+Math.cos(a)*rad*1.6, 92+Math.sin(a)*rad]); }
  let len = 0; pts.forEach((p,i) => { const q = pts[(i+1)%k]; len += Math.hypot(q[0]-p[0], q[1]-p[1]); });
  const m = Math.round(len/s*10);
  return { title:'Quelle longueur de clôture autour de ce terrain ?', unit:'m', answer:m, tol:m*0.4,
    svg:`<polygon class="rplein" points="${pts.map(p => f1(p[0])+','+f1(p[1])).join(' ')}"/>${ref(s,'10 m')}` };
}
function qAplomb(r){
  const d = ri(r,2,30), dx = d*0.8*(r()<0.5?-1:1), x = 160;
  return { title:'Ce mur de 200 cm penche. De combien en tête ?', unit:'cm', answer:d, tol:Math.max(4,d*0.5),
    svg:`<path class="rep" d="M40 195H300"/><polygon class="rplein" points="${x},195 ${x+24},195 ${f1(x+24+dx)},35 ${f1(x+dx)},35"/><path class="tiret" d="M${dx>0?x:x+24} 195V22"/>
<path class="rep" d="M95 35V195M89 35H101M89 195H101"/><text x="30" y="120">200 cm</text>` };
}
function qHauteur(r){
  const h = ri(r,18,45), H = Math.round(ri(r,70,180)/h*18)/10, P = H/1.8*h, t = 200-h, x = 105;
  return { title:'Ce gars mesure 1,80 m. Quelle hauteur fait le poteau ?', unit:'m', answer:H, tol:H*0.4,
    svg:`<path class="rep" d="M30 200H310"/><rect class="rplein" x="205" y="${f1(200-P)}" width="10" height="${f1(P)}"/>
<circle class="rep" cx="${x}" cy="${f1(t+h*0.1)}" r="${f1(h*0.1)}"/><path class="rep" d="M${x} ${f1(t+h*0.2)}V${f1(200-h*0.42)}L${f1(x-h*0.14)} 200M${x} ${f1(200-h*0.42)}L${f1(x+h*0.14)} 200M${f1(x-h*0.18)} ${f1(t+h*0.52)}L${x} ${f1(t+h*0.3)}L${f1(x+h*0.18)} ${f1(t+h*0.52)}"/>
<text x="${x}" y="216" text-anchor="middle">1,80 m</text>` };
}
function qSerpent(r){
  const A = ri(r,30,75), f = ri(r,4,10)/2, phi = r()*6.28, s = ri(r,26,40); let len = 0, px = 0, py = 0, d = '';
  for(let i=0;i<=240;i++){ const t = i/240, x = 25+290*t, y = 100+A*Math.sin(2*Math.PI*f*t+phi); if(i) len += Math.hypot(x-px,y-py); d += (i?'L':'M')+f1(x)+' '+f1(y); px = x; py = y; }
  const m = Math.round(len/s);
  return { title:'Combien de mètres de tuyau ?', unit:'m', answer:m, tol:m*0.4, svg:`<path class="cible" style="stroke-width:7" d="${d}"/>${ref(s,'1 m')}` };
}
const OUTILS = [
  `<rect x="-2.5" y="-12" width="5" height="29" fill="#1d4ed8"/><rect x="-11" y="-18" width="22" height="9" rx="1.5" fill="#14213d"/>`,
  `<polygon points="0,-18 9,3 -9,3" fill="#c9d1dc" stroke="#14213d" stroke-width="1.5"/><rect x="-2.2" y="3" width="4.4" height="14" rx="2" fill="#d62828"/>`,
  `<rect x="-2.2" y="-10" width="4.4" height="20" fill="#7d8797"/><circle cy="-14" r="5.5" fill="none" stroke="#7d8797" stroke-width="3.5"/><circle cy="14" r="4.5" fill="none" stroke="#7d8797" stroke-width="3.5"/>`,
  `<rect x="-1.3" y="-18" width="2.6" height="21" fill="#14213d"/><rect x="-4" y="3" width="8" height="15" rx="3" fill="#d62828"/>`
];
function qOutils(r){
  const n = ri(r,8,22), cells = [...Array(24).keys()], marteaux = r() < 0.5;
  for(let i=23;i>0;i--){ const j = Math.floor(r()*(i+1)); [cells[i],cells[j]] = [cells[j],cells[i]]; }
  let c = 0, svg = '';
  for(let i=0;i<n;i++){ const t = i === 0 ? 0 : ri(r,0,3), col = cells[i]%6, row = Math.floor(cells[i]/6); if(t === 0) c++;
    svg += `<g transform="translate(${f1(37+col*53.3+ri(r,-6,6))} ${f1(35+row*50+ri(r,-5,5))}) rotate(${ri(r,0,359)})">${OUTILS[t]}</g>`; }
  const ans = marteaux ? c : n;
  return { title: marteaux ? 'Combien de marteaux sur la bâche ?' : 'Combien d\'outils sur la bâche ?', unit:'', answer:ans, tol:Math.max(2,ans*0.4), svg };
}
function qClous(r){
  const n = ri(r,15,60); let svg = '';
  for(let i=0;i<n;i++) svg += `<g transform="translate(${ri(r,20,320)} ${ri(r,18,202)}) rotate(${ri(r,0,359)})"><path d="M-7 0H7" stroke="#14213d" stroke-width="1.8"/><circle cx="-7" r="2.6" fill="#d62828"/></g>`;
  return { title:'Combien de clous par terre ?', unit:'', answer:n, tol:n*0.4, svg };
}
function qFenetres(r){
  const cols = ri(r,4,9), rows = ri(r,3,7), cw = 280/cols, ch = 175/rows; let n = 0, svg = '<rect class="plein" x="30" y="22" width="280" height="178"/>';
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){ if(r() > 0.85 && (x||y)) continue; n++;
    svg += `<rect x="${f1(30+x*cw+cw*0.2)}" y="${f1(25+y*ch+ch*0.2)}" width="${f1(cw*0.6)}" height="${f1(ch*0.6)}" fill="#d6e2ff" stroke="#1d4ed8" stroke-width="1.5"/>`; }
  return { title:'Combien de fenêtres sur cette façade ?', unit:'', answer:n, tol:n*0.4, svg };
}
const bonhomme = (x,h) => { const t = 200-h; return `<circle class="rep" cx="${x}" cy="${f1(t+h*0.1)}" r="${f1(h*0.1)}"/><path class="rep" d="M${x} ${f1(t+h*0.2)}V${f1(200-h*0.42)}L${f1(x-h*0.14)} 200M${x} ${f1(200-h*0.42)}L${f1(x+h*0.14)} 200M${f1(x-h*0.18)} ${f1(t+h*0.52)}L${x} ${f1(t+h*0.3)}L${f1(x+h*0.18)} ${f1(t+h*0.52)}"/>`; };
function qPalettes(r){
  const n = ri(r,5,24), h = Math.min(16,178/n), x = 110, w = 120; let svg = '';
  for(let i=0;i<n;i++){ const y = 200-(i+1)*h; svg += `<rect class="plein" x="${x}" y="${f1(y)}" width="${w}" height="${f1(h*0.35)}"/>` + [0,w/2-8,w-16].map(o => `<rect class="plein" x="${x+o}" y="${f1(y+h*0.35)}" width="16" height="${f1(h*0.55)}"/>`).join(''); }
  return { title:'Combien de palettes empilées ?', unit:'', answer:n, tol:Math.max(2,n*0.3), svg };
}
function qCasques(r){
  const n = ri(r,10,40), rouges = r() < 0.5; let c = 0, svg = '';
  for(let i=0;i<n;i++){ const red = i === 0 || r() < 0.4; if(red) c++;
    svg += `<g transform="translate(${ri(r,20,320)} ${ri(r,20,200)})"><circle r="8" fill="${red?'#d62828':'#1d4ed8'}" stroke="#14213d" stroke-width="1.5"/><circle r="3" fill="#fff" opacity=".7"/></g>`; }
  const ans = rouges ? c : n;
  return { title: rouges ? 'Combien de casques rouges sur le chantier ?' : 'Combien de casques sur le chantier ?', unit:'', answer:ans, tol:Math.max(2,ans*0.4), svg };
}
function qEchaf(r){
  const et = ri(r,4,14), tr = ri(r,2,4), h = 178/et, w = 220/tr, x0 = 60; let d = '';
  for(let t=0;t<=tr;t++) d += `M${f1(x0+t*w)} 200V${f1(200-et*h)}`;
  for(let e=0;e<=et;e++) d += `M${x0} ${f1(200-e*h)}H${f1(x0+tr*w)}`;
  for(let e=0;e<et;e++){ const b = e%tr; d += `M${f1(x0+b*w)} ${f1(200-e*h)}L${f1(x0+(b+1)*w)} ${f1(200-(e+1)*h)}`; }
  return { title:'Combien d\'étages à cet échafaudage ?', unit:'', answer:et, tol:Math.max(2,et*0.3), svg:`<path class="rep" d="${d}"/>` };

${nb === 1 ? '<p class="petit">Tu es seul sur le podium pour l\'instant. Envoie le lien : il se remplira quand tes potes auront joué et t\'auront renvoyé le leur.</p>' : ''}
${nb > 3 ? '<h2>Classement complet</h2>'+rankHtml(seed, me.name) : ''}
<a class="btn" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>
<button id="copier" class="second">Copier le lien du défi</button>
<button id="nouveau" class="second">Lancer une revanche</button>
<p class="petit" id="info" role="status" style="margin-top:14px">Le classement voyage dans le lien : chacun renvoie le sien dans le groupe après avoir joué, et le dernier lien ouvert met ton classement à jour. Code à donner de vive voix : ${esc(seed)}.</p>`;
  el('copier').onclick = async () => {
    try{ await navigator.clipboard.writeText(url); el('info').textContent = 'Lien copié. Colle-le dans le groupe.'; }
    catch(e){ el('info').textContent = url; }
  };
  el('nouveau').onclick = () => play(newSeed(), me.name);
  if(gagne) feu();
}

/* ---------- démarrage ---------- */
(function(){
  const p = new URLSearchParams(location.search), d = (p.get('d')||'').toUpperCase();
  if(/^[A-Z0-9]{4,16}$/.test(d)){
    if(p.get('r')) merge(d, dec(p.get('r')));
    store.get('odm_p_'+d) ? result(d) : invite(d);
  } else home();
})();
</script>
</body>
</html>
